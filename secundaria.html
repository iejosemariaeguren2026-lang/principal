
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nivel Secundaria - José María Eguren</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#e9f5ec;
  font-family:Arial,sans-serif;
}

/* La portada ocupa toda la pantalla */
.portada{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#fff;
}

/* Imagen original, sin modificaciones */
.portada img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}

/* Zonas transparentes sobre cada grado */
.grado{
  position:absolute;
  z-index:5;
  display:block;
  background:transparent;
  border:0;
  border-radius:18px;
  cursor:pointer;
}

/* Se conservan las posiciones originales */
.grado-1{
  left:25.8%;
  top:37.2%;
  width:8.7%;
  height:21.8%;
}

.grado-2{
  left:35.4%;
  top:37.2%;
  width:8.7%;
  height:21.8%;
}

.grado-3{
  left:46.0%;
  top:37.2%;
  width:8.7%;
  height:21.8%;
}

.grado-4{
  left:55.6%;
  top:37.2%;
  width:8.7%;
  height:21.8%;
}

.grado-5{
  left:66%;
  top:37.2%;
  width:8%;
  height:21.8%;
}

.grado:hover,
.grado:focus-visible{
  background:rgba(255,255,255,.10);
  box-shadow:0 0 0 4px rgba(13,104,60,.40);
}

@media(max-width:700px){
  .grado{
    border-radius:8px;
  }

  .grado:hover,
  .grado:focus-visible{
    box-shadow:0 0 0 2px rgba(13,104,60,.45);
  }
}
</style>
</head>

<body>

<main class="portada">

  <!-- Portada original -->
  <img
    src="portada-secundaria.png"
    alt="Bienvenidos al nivel secundaria"
  >

  <!-- PRIMERO -->
  <a
    class="grado grado-1"
    href="materiales.html?grado=1"
    aria-label="Materiales de Primero de Secundaria"
    title="1.º de Secundaria">
  </a>

  <!-- SEGUNDO -->
  <a
    class="grado grado-2"
    href="materiales.html?grado=2"
    aria-label="Materiales de Segundo de Secundaria"
    title="2.º de Secundaria">
  </a>

  <!-- TERCERO -->
  <a
    class="grado grado-3"
    href="materiales.html?grado=3"
    aria-label="Materiales de Tercero de Secundaria"
    title="3.º de Secundaria">
  </a>

  <!-- CUARTO -->
  <a
    class="grado grado-4"
    href="materiales.html?grado=4"
    aria-label="Materiales de Cuarto de Secundaria"
    title="4.º de Secundaria">
  </a>

  <!-- QUINTO -->
  <a
    class="grado grado-5"
    href="materiales.html?grado=5"
    aria-label="Materiales de Quinto de Secundaria"
    title="5.º de Secundaria">
  </a>

</main>

</body>
</html>
